name: unit-tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff==0.14.0
      - run: ruff check tests demos

  rag-demo:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_demo
          POSTGRES_PASSWORD: rag_demo
          POSTGRES_DB: rag_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag_demo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag_demo:rag_demo@localhost:5432/rag_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r demos/rag-demo/requirements.txt pytest==8.4.2 reportlab==4.4.4
      - run: pytest tests/unit/rag -v

  invoice-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r demos/invoice-demo/requirements.txt pytest==8.4.2
      - run: pytest tests/unit/invoice -v
