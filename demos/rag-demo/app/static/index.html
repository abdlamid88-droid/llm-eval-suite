<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسأل وثيقتك — ديمو RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #e4e2da; --accent: #0f6e56; --accent-soft: #e3f1ec; --warn: #a3412b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1e1f1c; --ink: #ecebe6; --muted: #9a998f;
            --line: #2e2f2b; --accent: #4cc39d; --accent-soft: #1d3029; --warn: #e48a72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.7 "IBM Plex Sans Arabic", system-ui, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 140px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 600; }
  header p { margin: 0 0 20px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center;
          cursor: pointer; color: var(--muted); transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .chip { background: var(--accent-soft); color: var(--accent); padding: 3px 12px; border-radius: 99px; font-size: .9rem; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; font: inherit; font-size: .85rem; }
  #chat { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 16px; border-radius: 14px; max-width: 92%; }
  .q { white-space: pre-wrap; }
  .a p { margin: 0 0 8px; }
  .a ul { margin: 0 0 8px; padding-inline-start: 22px; }
  .a li { margin-bottom: 4px; }
  .q { align-self: flex-start; background: var(--accent); color: #fff; }
  .a { align-self: flex-end; background: var(--panel); border: 1px solid var(--line); }
  .cite { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 5px; font-weight: 500; }
  details { margin-top: 10px; font-size: .9rem; color: var(--muted); }
  details summary { cursor: pointer; }
  .src { border-top: 1px solid var(--line); padding: 8px 0; }
  .src b { color: var(--ink); }
  .err { color: var(--warn); }
  form { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px; }
  form .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
                     background: var(--panel); color: var(--ink); font: inherit; }
  button.send { padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .hint { font-size: .85rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>اسأل وثيقتك</h1>
    <p>ارفع ملف PDF واسأل عنه. الإجابة تأتي من الوثيقة فقط، مع رقم الصفحة لكل معلومة.</p>
  </header>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf" hidden>
      <span id="dropText">اسحب ملف PDF هنا أو اضغط للاختيار</span>
    </label>
    <div class="docs" id="docs"></div>
    <div class="hint">نسخة تجريبية تعمل على الطبقة المجانية من Gemini، وقد تستخدم Google المحتوى المرسل لتحسين خدماتها، فلا ترفع وثائق سرية أو شخصية. حتى 3 ملفات، وتُحذف تلقائياً بعد 24 ساعة.</div>
  </div>

  <div id="chat"></div>
</div>

<form id="ask">
  <div class="row">
    <input type="text" id="q" placeholder="اكتب سؤالك عن الوثيقة…" autocomplete="off" maxlength="500">
    <button class="send" id="send">اسأل</button>
  </div>
</form>

<script>
let sid;
try { sid = localStorage.getItem("rag_sid"); } catch (e) {}
if (!sid) {
  sid = (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("")).toLowerCase();
  try { localStorage.setItem("rag_sid", sid); } catch (e) {}
}
const H = { "X-Session-Id": sid };
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || "حدث خطأ، حاول مجدداً.");
  return data;
}

// تنسيق Markdown بسيط وآمن: يُطبَّق بعد escape، فلا يمكن حقن HTML
function md(text) {
  const lines = esc(text).split(/\n/);
  let html = "", inList = false;
  for (let line of lines) {
    const item = line.match(/^\s*[*\-•]\s+(.*)$/);
    if (item) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${item[1]}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^#{1,4}\s+(.*)$/);
    html += h ? `<p><b>${h[1]}</b></p>` : (line.trim() ? `<p>${line}</p>` : "");
  }
  if (inList) html += "</ul>";
  return html
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[ص\s*(\d+)\]/g, '<span class="cite">ص $1</span>');
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function loadDocs() {
  const docs = await api("/api/documents").catch(() => []);
  $("docs").innerHTML = docs.map(d => `<span class="chip">${esc(d.filename)} · ${d.pages} ص</span>`).join("")
    + (docs.length ? `<button class="link" id="clear">مسح الملفات</button>` : "");
  const c = $("clear");
  if (c) c.onclick = async () => { await api("/api/documents", { method: "DELETE" }); loadDocs(); };
}

async function upload(file) {
  if (!file) return;
  $("dropText").textContent = `جارٍ قراءة «${file.name}» وفهرسته…`;
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await api("/api/upload", { method: "POST", body: fd });
    $("dropText").textContent = `تمت الفهرسة: ${r.pages} صفحة، ${r.chunks} مقطع. اسأل الآن.`;
    $("q").focus();
  } catch (e) {
    $("dropText").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
  loadDocs();
}

$("file").onchange = e => upload(e.target.files[0]);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files[0]); };

function add(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.innerHTML = html;
  $("chat").appendChild(d); d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

$("ask").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q.length < 2) return;
  $("q").value = ""; $("send").disabled = true;
  add("q", esc(q));
  const box = add("a", "…");
  try {
    const r = await api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const ans = md(r.answer);
    const src = r.sources.length ? `<details><summary>المقاطع المستخدمة (${r.sources.length})</summary>${
      r.sources.map(s => `<div class="src"><b>${esc(s.filename)} — صفحة ${s.page}</b><br>${esc(s.snippet)}…</div>`).join("")}</details>` : "";
    box.innerHTML = ans + src;
  } catch (err) {
    box.innerHTML = `<span class="err">${esc(err.message)}</span>`;
  }
  $("send").disabled = false; $("q").focus();
};

loadDocs();
</script>
</body>
</html>
